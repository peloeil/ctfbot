[project]
name = "ctfbot"
version = "1.0.0"
requires-python = ">=3.15.0"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "discord-py[voice]>=2.7.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctfbot"]

[dependency-groups]
dev = ["ruff>=0.17.1", "ty>=0.0.90"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM", "RUF"]
# Voice labels are "キャラクター名（スタイル名）" with full-width parentheses
allowed-confusables = ["（", "）"]

[tool.ty.environment]
root = ["./src"]
