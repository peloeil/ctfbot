[project]
name = "ctfbot"
version = "1.0.0"
requires-python = ">=3.14.6"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "discord-py>=2.7.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[dependency-groups]
dev = ["ruff>=0.16.0", "ty>=0.0.63"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ty.environment]
root = ["./src"]
python = "./.venv"
